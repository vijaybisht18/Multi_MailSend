<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="page">
        <h1>EMAIL SENDER</h1>
        <div class="divider"></div>

        <form action="/send" method="POST" enctype="multipart/form-data">

            <div class="form-grid">

                <!-- Left side -->
                <div class="left-column">

                    <div class="field sender-field">
                        <label for="sender_email"><b>Enter Mail:</b></label>
                        <input
                            type="email"
                            id="sender_email"
                            name="sender_email"
                            placeholder="@gmail.com"
                        >
                    </div>

                    <div class="field recipients-field">
                        <label for="recipients"><b>Recipient Emails (to):</b></label>
                        <textarea
                            id="recipients"
                            name="recipients"
                            placeholder="Enter Email IDs"
                        ></textarea>
                    </div>

                </div>

                <!-- Right side -->
                <div class="right-column">

                    <div class="field password-field">
                        <label for="app_password"><B>Password:</B></label>
                        <input
                            type="password"
                            id="app_password"
                            name="app_password"
                            placeholder="app_password"
                            required
                        >
                    </div>

                    <div class="field subject-field">
                        <label for="subject"><b>Subject:</b></label>
                        <textarea
                            id="subject"
                            name="subject"
                            required
                        ></textarea>
                    </div>

                    <div class="field message-field">
                        <label for="message"><b>Message:</b></label>
                        <textarea
                            id="message"
                            name="message"
                            rows="10"
                        ></textarea>
                    </div>

                    <div class="field attachment-field">
                        <label for="attachment"><b>Attachment:</b></label>
                        <input
                            type="file"
                            id="attachment"
                            name="attachment"
                        >
                    </div>

                </div>

            </div>

            <button type="submit" class="send-button">SEND MAIL</button>

        </form>
    </div>

    {% if success %}
    <div class="popup-overlay" id="successPopup">
        <div class="popup">
            <h2>✓</h2>
            <h3>Successfully Email Sent</h3>
            <button type="button" onclick="closePopup()">OK</button>
        </div>
    </div>
    {% endif %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
